<main class="manager-main">
 <div class="manager-heading"><div><p class="eyebrow">LimitRSS Plaza</p><h1 data-t="heading">订阅源管理</h1><p class="muted" data-t="intro">编辑与管理社区分享的订阅源，保存后立即生效。</p></div><button id="logout" hidden data-t="logout">退出登录</button></div>
 <p id="message" role="status" aria-live="polite"></p>
 <section id="login-panel" class="manager-panel login-panel">
  <h2 data-t="loginHeading">管理员登录</h2><p class="muted" data-t="loginIntro">使用已授权的官网账号登录。</p>
  <form id="login-form"><label><span data-t="email">邮箱</span><input name="email" type="email" autocomplete="username" required></label><label><span data-t="password">密码</span><input name="password" type="password" autocomplete="current-password" required></label>
   <div class="cf-turnstile" data-sitekey="0x4AAAAAADnCSF3mvj9vqAEf"></div><button class="primary" type="submit" data-t="login">登录</button>
  </form>
 </section>
 <section id="workspace" hidden>
  <div class="manager-tabs" role="group" data-label="views"><button id="feeds-tab" aria-pressed="true" data-t="feeds">订阅源</button><button id="audit-tab" aria-pressed="false" data-t="audit">操作记录</button><button id="refresh" data-t="refresh">刷新</button></div>
  <form id="filters" class="manager-filters"><label><span data-t="search">搜索</span><input id="search" type="search" data-placeholder="searchHint"></label><label><span data-t="category">分类</span><select id="category"></select></label><label><span data-t="visibility">状态</span><select id="state"></select></label><button type="submit" data-t="search">搜索</button></form>
  <div class="list-heading"><h2 id="list-title" data-t="feeds">订阅源</h2><p id="summary" role="status" aria-live="polite"></p></div>
  <div class="manager-table-wrap" tabindex="0" role="region" aria-labelledby="list-title"><table class="manager-table"><thead id="table-head"></thead><tbody id="rows"></tbody></table></div>
  <div class="pagination"><button id="previous" data-t="previous">上一页</button><span id="page"></span><button id="next" data-t="next">下一页</button></div>
 </section>
</main>
<dialog id="editor" aria-labelledby="editor-title"><form id="edit-form">
 <div class="dialog-heading"><h2 id="editor-title" data-t="editHeading">编辑订阅源</h2><button class="close" type="button" data-close="editor" data-label="close">×</button></div>
 <label><span data-t="title">名称</span><input name="title" required maxlength="200"></label><label><span data-t="address">订阅地址</span><input name="url" required maxlength="2048"></label><label><span data-t="icon">图标地址</span><input name="icon" type="url" maxlength="2048"></label>
 <div class="field-pair"><label><span data-t="category">分类</span><select name="category" id="edit-category"></select></label><label><span data-t="language">语言</span><input name="language" list="languages" maxlength="48" data-placeholder="languageHint"><datalist id="languages"><option value="zh"><option value="zh-cn"><option value="zh-tw"><option value="en"><option value="ja"><option value="ko"><option value="fr"><option value="de"><option value="es"></datalist></label></div>
 <p class="muted" data-t="editHint">分类和语言不会被自动检测覆盖。修改订阅地址后将重新检测。</p><p id="edit-message" class="form-message" role="status" aria-live="polite"></p>
 <div class="dialog-actions"><button type="button" data-close="editor" data-t="cancel">取消</button><button class="primary" type="submit" data-t="save">保存</button></div>
</form></dialog>
<dialog id="confirm" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><p id="confirm-description"></p><p id="confirm-message" class="form-message" role="status"></p><div class="dialog-actions"><button type="button" data-close="confirm" data-t="cancel">取消</button><button id="confirm-action" class="primary" type="button" data-t="confirm">确认</button></div></dialog>
<dialog id="audit-detail" aria-labelledby="audit-title"><div class="dialog-heading"><h2 id="audit-title" data-t="auditDetail">修改详情</h2><button class="close" data-close="audit-detail" data-label="close">×</button></div><div id="audit-content"></div></dialog>
