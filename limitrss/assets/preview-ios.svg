<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="bg-ios" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="phone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" fill="#fafafa"/>
  <rect width="1280" height="800" fill="url(#bg-ios)"/>

  <!-- iPhone 框架 -->
  <g transform="translate(490 130)">
    <rect x="0" y="0" width="300" height="600" rx="48" fill="url(#phone)"/>
    <rect x="8" y="8" width="284" height="584" rx="42" fill="#fff"/>
    <!-- 顶部刘海 -->
    <rect x="100" y="20" width="100" height="22" rx="11" fill="#0a0a0a"/>
    <!-- 屏幕内容占位 -->
    <rect x="20" y="60" width="260" height="40" rx="8" fill="#f0f0f0"/>
    <g opacity="0.7">
      <rect x="20" y="120" width="260" height="60" rx="10" fill="#f5f5f5"/>
      <rect x="20" y="195" width="260" height="60" rx="10" fill="#f5f5f5"/>
      <rect x="20" y="270" width="260" height="60" rx="10" fill="#f5f5f5"/>
      <rect x="20" y="345" width="260" height="60" rx="10" fill="#f5f5f5"/>
    </g>
    <!-- 底部 home bar -->
    <rect x="120" y="560" width="60" height="4" rx="2" fill="#0a0a0a"/>
  </g>

  <!-- Apple 风格 logo -->
  <g transform="translate(560 60)">
    <path fill="#1f1f1f" d="M62 16c-1 5-3 9-6 13-3 4-7 8-12 8-4 0-6-2-10-2-4 0-7 2-10 2-5 0-9-4-12-8-7-9-8-23-3-33 3-6 9-10 16-10 4 0 8 2 11 2 3 0 6-2 11-2 3 0 9 1 13 6-9 5-7 17 2 24zM50 7c2-3 3-6 3-10-3 0-7 2-9 5-2 2-3 6-3 9 4 1 7-1 9-4z"/>
  </g>

  <text x="640" y="780" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="14" fill="#888" text-anchor="middle">
    LimitRSS v0.1.0 · iOS · IPA 自签 / TestFlight
  </text>
</svg>